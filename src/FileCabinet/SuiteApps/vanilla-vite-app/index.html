<!doctype html>
<html lang="en" class="h-full bg-white">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web-animations/2.3.2/web-animations.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.0.5/js/dataTables.js" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.0.5/js/dataTables.bootstrap5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Aligns datatables extra elements in a single row -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.7/css/dataTables.bootstrap4.css">
    <!-- Working navtabs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.0.0-beta/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <!-- Toastify JS -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Multiselect filter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.1/js/bootstrap-select.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.1/css/bootstrap-select.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  </head>
  <body class="h-full">
    <div id="app" class="min-h-screen">
      <header class="header tab-container">
        <div class="tab active board" data-target="boardSection">Board</div>
        <div class="tab calendar" data-target="calendarSection">Calendar</div>
      </header>
      <footer>
        <div class="floating-logo" data-bs-toggle="tooltip" data-bs-placement="right" title="N/A">
          <img src="dist/assets/ai.png" alt="Logo" />
        </div>
      </footer>
    </div>

    <script type="module" src="main.js" defer></script>
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="/src/components/eventModal.js" defer></script>
    <script type="module" src="/src/components/generalEventModal.js" defer></script>
    <script type="module" src="/src/components/completeEventModal.js" defer></script>
    <script type="module" src="/src/components/filterFields/resource.js" defer></script>
    <script type="module" src="/src/components/filterFields/boardJob.js" defer></script>
    <script type="module" src="/src/components/filterFields/boardEvent.js" defer></script>
    <script type="module" src="/src/components/filterFields/calendarEvent.js" defer></script>
    <script type="module" src="/src/components/filterFields/calendarJob.js" defer></script>
    <script type="module" src="/src/components/filterFields/eventResource.js" defer></script>
    <script type="module" src="/src/components/filterFields/generalEventResource.js" defer></script>
    <script type="module" src="/src/components/dragResource.js" defer></script>
    <input type="hidden" id="userId" value="{{userId}}" />
    <input type="hidden" id="suiteletUrl" value="{{suiteletUrl}}" />
    <input type="hidden" id="resources" value="{{resources}}" />
    <input type="hidden" id="resourceGroups" value="{{resourceGroups}}" />
    <input type="hidden" id="resourceSkills" value="{{resourceSkills}}" />
    <input type="hidden" id="resourceLocations" value="{{resourceLocations}}" />
    <input type="hidden" id="resourceDepartments" value="{{resourceDepartments}}" />
    <input type="hidden" id="vendors" value="{{vendors}}" />
    <input type="hidden" id="assets" value="{{assets}}" />
    <input type="hidden" id="workOrders" value="{{workOrders}}" />
    <input type="hidden" id="woResources" value="{{woResources}}" />
    <input type="hidden" id="customers" value="{{customers}}" />
    <input type="hidden" id="woLocations" value="{{woLocations}}" />
    <input type="hidden" id="woProjects" value="{{woProjects}}" />
    <input type="hidden" id="woStatuses" value="{{woStatuses}}" />
    <input type="hidden" id="events" value="{{events}}" />
    <input type="hidden" id="organizers" value="{{organizers}}" />
    <input type="hidden" id="filterFields" value="{{filterFields}}" />
  </body>
</html>
